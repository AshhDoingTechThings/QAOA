<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QAOA Health Optimiser</title>
<link rel="stylesheet" href="/static/css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237cc4ff' stroke-width='2.5'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23a58bff' stroke-width='3'/%3E%3C/svg%3E" />
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.js", "three/addons/": "/static/vendor/" } }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#a58bff"/></linearGradient></defs>
      <circle cx="17" cy="17" r="14" fill="none" stroke="url(#lg)" stroke-width="2"/>
      <ellipse cx="17" cy="17" rx="14" ry="5" fill="none" stroke="#7cc4ff" stroke-opacity=".45" stroke-width="1.2"/>
      <path d="M17 10v14M10 17h14" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>QAOA Health Optimiser</h1>
      <p>Hybrid Quantum-Classical Framework for Healthcare Resource Optimization · Team 09 · VJIT Dept. of AI</p>
    </div>
  </div>
  <div class="spacer"></div>
  <select id="preset" aria-label="Scenario preset"></select>
  <span class="chip" id="backend-chip"><span class="dot" id="backend-dot"></span><span id="backend-txt">connecting…</span></span>
  <button class="btn primary" id="run-all">▶ Run full pipeline</button>
</header>

<nav class="pipeline" id="pipeline" aria-label="Pipeline stages">
  <button class="step active" data-stage="0"><span class="num">0</span><span class="lbl"><b>Overview</b>Problem</span></button>
  <button class="step" data-stage="1"><span class="num">1</span><span class="lbl"><b>Scenario</b>Healthcare input</span></button>
  <button class="step" data-stage="2"><span class="num">2</span><span class="lbl"><b>Model → QUBO</b>Penalty terms</span></button>
  <button class="step" data-stage="3"><span class="num">3</span><span class="lbl"><b>Ising</b>Hamiltonian</span></button>
  <button class="step" data-stage="4"><span class="num">4</span><span class="lbl"><b>QAOA</b>Qiskit · noise</span></button>
  <button class="step" data-stage="5"><span class="num">5</span><span class="lbl"><b>Results</b>Allocation</span></button>
  <button class="step" data-stage="6"><span class="num">6</span><span class="lbl"><b>Benchmark</b>Metrics</span></button>
</nav>

<main>
</main>
</body>
</html>
